<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduate 15 Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="day">
    <div class="app-container">
        <header class="top-bar">
            <h1>15 Puzzle: Seasonal</h1>
            <button id="toggle-theme" class="theme-btn">Toggle Night Mode</button>
        </header>

        <main class="app-layout">
            <section class="game-zone">
                <div class="level-tabs">
                    <button class="mode-btn active" data-mode="bloom">Bloom</button>
                    <button class="mode-btn" data-mode="breeze">Breeze</button>
                    <button class="mode-btn" data-mode="sun">Sun</button>
                </div>

                <div class="live-stats">
                    <div class="stat-badge">Moves: <span id="move-count">0</span></div>
                    <div class="stat-badge">Time: <span id="timer">0</span>s</div>
                </div>

                <div id="puzzle-board"></div>

                <div class="action-controls">
                    <button id="shuffle-btn" class="action-btn">Shuffle (360)</button>
                    <button id="magic-btn" class="action-btn hint-btn">Hint (1 Left)</button>
                    <button id="reset-btn" class="action-btn outline-btn">Reset</button>
                </div>
            </section>

            <aside class="data-zone">
                <div class="data-panel">
                    <h2>Performance Insights</h2>
                    <ul class="data-list">
                        <li><strong>Runs:</strong> <span id="total-runs">0</span></li>
                        <li><strong>Avg Time:</strong> <span id="avg-time">0</span>s</li>
                        <li><strong>Record:</strong> <span id="best-run">None yet</span></li>
                        <li><strong>Popularity:</strong> <span id="mode-dist">No data</span></li>
                    </ul>
                </div>

                <div class="data-panel">
                    <h2>Leaderboard</h2>
                    <ul id="score-list" class="leaderboard-list"></ul>
                </div>
            </aside>
        </main>
    </div>
    <script src="puzzle.js"></script>
</body>

</html>
